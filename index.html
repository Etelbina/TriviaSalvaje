<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trivia Salvaje: un proyecto creado en dupla durante el proceso de preadmisión de Laboratoria y revisitado individualmente para el portafolio, aprendiendo con IA."
    />
    <meta name="author" content="Etelbina Cañedo, Valeria Diaz" />
    <title>Trivia Salvaje</title>
  </head>
  <body>
    <header>
      <img
        src="https://cdn.glitch.global/dd7f20cf-a82f-456c-be93-e62e7360f6d5/font-weight%20600%3B.svg?v=1699373205294"
        alt="Trivia Salvaje"
        class="logo"
      />
    </header>
    <main>
      <section id="welcome" class="welcome card">
        <form id="welcomeForm">
          <label class="lablebox" for="name">Ingresa tu nombre</label><br />
          <input class="box" type="text" id="name" name="name" required />
          <button id="buttonWelcome" type="submit" class="button">Enviar</button>
        </form>
      </section>

      <section id="greeting" class="card" hidden>
        <p id="greetingMessage" class="message" aria-live="polite"></p>
        <button id="buttonStart" type="button" class="button">Comenzar</button>
      </section>

      <section id="animals" hidden>
        <section id="first" class="first card">
          <h2>
            1. Vuelo de noche, duermo de día y nunca verás plumas, en el ala
            mía. ¿Quién soy?
          </h2>
          <form id="questionForm1" class="questionForm">
            <input
              type="radio"
              id="answer1.1"
              name="question1"
              value="pinguino"
              required
            />
            <label for="answer1.1" class="answer">Pingüino</label> <br />
            <input
              type="radio"
              id="answer1.2"
              name="question1"
              value="murcielago"
            />
            <label for="answer1.2" class="answer">Murciélago</label> <br />
            <input
              type="radio"
              id="answer1.3"
              name="question1"
              value="gato"
            />
            <label for="answer1.3" class="answer">Gato</label> <br />
            <button type="submit" class="button" id="buttonQuestion1">
              Enviar
            </button>
            <p class="message" id="rightAnswer1" aria-live="polite" hidden></p>
          </form>
        </section>

        <section id="second" class="second card" hidden>
          <h2>
            2. Canto en la orilla, vivo en el agua, no soy pescado ni soy
            cigarra. ¿Quién soy?
          </h2>
          <form id="questionForm2" class="questionForm">
            <input
              type="radio"
              id="answer2.1"
              name="question2"
              value="perro"
              required
            />
            <label for="answer2.1" class="answer">Perro</label> <br />
            <input
              type="radio"
              id="answer2.2"
              name="question2"
              value="gallina"
            />
            <label for="answer2.2" class="answer">Gallina</label> <br />
            <input
              type="radio"
              id="answer2.3"
              name="question2"
              value="rana"
            />
            <label for="answer2.3" class="answer">Rana</label> <br />
            <button type="submit" class="button" id="buttonQuestion2">
              Enviar
            </button>
            <p class="message" id="rightAnswer2" aria-live="polite" hidden></p>
          </form>
        </section>

        <section id="third" class="third card" hidden>
          <h2>
            3. Tengo grandes orejas y trompa, me gusta comer hojas y bañar mi
            dura piel. ¿Quién soy?
          </h2>
          <form id="questionForm3" class="questionForm">
            <input
              type="radio"
              id="answer3.1"
              name="question3"
              value="elefante"
              required
            />
            <label for="answer3.1" class="answer">Elefante</label> <br />
            <input
              type="radio"
              id="answer3.2"
              name="question3"
              value="hipopotamo"
            />
            <label for="answer3.2" class="answer">Hipopótamo</label> <br />
            <input
              type="radio"
              id="answer3.3"
              name="question3"
              value="jirafa"
            />
            <label for="answer3.3" class="answer">Jirafa</label> <br />
            <button type="submit" class="button" id="buttonQuestion3">
              Enviar
            </button>
            <p class="message" id="rightAnswer3" aria-live="polite" hidden></p>
          </form>
        </section>
      </section>

      <section id="finish" class="card" hidden>
        <p>Terminaste la trivia.</p>
        <button id="buttonRestart" type="button" class="button">Volver a jugar</button>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
